# Proves the gates. `unit` runs the script tests and every gate's run blocks against fixtures (a failing
# fixture must fail, a passing one must pass). The call-* jobs then call each reusable workflow once on a
# passing fixture, as a consumer does. `self-test` is the single required check and fails if any of them did.
name: self-test
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install datacontract-cli
        run: pip install datacontract-cli==1.2.8
      - name: Script tests
        run: node --test test/*.test.mjs
      - name: Gate run blocks against fixtures
        run: node test/run-blocks.mjs

  call-squawk:
    permissions:
      contents: read
      pull-requests: read # the guard reads the PR's reviews; a caller cannot grant less than the called job declares
    uses: ./.github/workflows/squawk.yml
    with:
      lint_all: true
      migration_globs: ":(glob)test/fixtures/squawk/ordinary/head/migrations/**/*.sql"
      config_path: test/fixtures/squawk/squawk.toml

  call-datacontract:
    permissions:
      contents: read
    uses: ./.github/workflows/datacontract.yml
    with:
      lint_all: true
      contracts_glob: test/fixtures/datacontract/passing/head/contracts/*.odcs.yaml

  call-dbt:
    permissions:
      contents: read
      id-token: write # the called workflow declares it; a caller cannot grant less
    uses: ./.github/workflows/dbt.yml
    with:
      lint_all: true
      dbt_project_dir: test/fixtures/dbt/duckdb-project
      adapter_package: dbt-duckdb==1.11.1
      auth: none

  call-governance:
    permissions:
      contents: write
    uses: ./.github/workflows/governance.yml
    with:
      checks: |
        gates:governance/version=version

  self-test:
    if: ${{ always() }}
    needs: [unit, call-squawk, call-datacontract, call-dbt, call-governance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Every job succeeded
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a self-test job did not succeed"; exit 1; }; done
