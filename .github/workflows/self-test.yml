# Proves the gates. `unit` runs the script tests and every gate's run blocks against fixtures (a failing
# fixture must fail, a passing one must pass). The call-* jobs then call each reusable workflow once on a
# passing fixture, as a consumer does. `call-datacontract-notice` calls the contract gate on a breaking
# fixture: it must FAIL (its red sub-check is expected), and `verify-notice` then reads the consumer notice
# it posted on this PR back from the API. Both run only on a pull request from this repo, because a fork's
# token cannot comment. `self-test` is the single required check: it fails unless every job ended the way
# it should.
name: self-test
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install datacontract-cli
        run: python3 -I -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements/datacontract-cli-1.2.8.txt
      - name: Script tests
        run: node --test test/*.test.mjs
      - name: VERSION is the tag this PR will get (next-tag.mjs on its semver label and the current tags)
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/version-check.mjs
      - name: Gate run blocks against fixtures
        run: node test/run-blocks.mjs

  # governance-check monitors on what the real tools write: `dbt parse` of a dbt-duckdb project with the
  # Elementary package, and GX Core file contexts. Every routed input passes and every break fails on its own
  # line (test/monitors-engine.sh). No token beyond contents: read; pip runs isolated from outside the checkout.
  monitors-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DO_NOT_TRACK: "1"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      GX_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: dbt-duckdb and GX Core from hash-pinned lockfiles
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for v in dbt gx; do python3 -I -m venv "$v"; done
          env -u BASH_ENV -u ENV dbt/bin/python -I -m pip install --disable-pip-version-check --quiet --require-hashes -r "$GITHUB_WORKSPACE/requirements/dbt-duckdb-1.11.1.txt"
          env -u BASH_ENV -u ENV gx/bin/python -I -m pip install --disable-pip-version-check --quiet --require-hashes -r "$GITHUB_WORKSPACE/requirements/great-expectations-1.24.1.txt"
          dbt/bin/dbt --version
          gx/bin/python -I -c "import great_expectations as g; print('great_expectations', g.__version__)"
      - name: monitors passes routed monitors and fails each break on a real manifest and real GX contexts
        env:
          DBT: ${{ runner.temp }}/dbt/bin/dbt
          GX_PYTHON: ${{ runner.temp }}/gx/bin/python
        run: env -u BASH_ENV -u ENV bash test/monitors-engine.sh

  call-squawk:
    permissions:
      contents: read
    uses: ./.github/workflows/squawk.yml
    with:
      lint_all: true
      migration_globs: ":(glob)test/fixtures/squawk/ordinary/head/migrations/**/*.sql"
      config_path: test/fixtures/squawk/squawk.toml

  call-datacontract:
    permissions:
      contents: read
      pull-requests: write # the called job declares it; a caller cannot grant less
    uses: ./.github/workflows/datacontract.yml
    with:
      lint_all: true
      contracts_dir: test/fixtures/datacontract/passing/head/contracts
      contracts_glob: test/fixtures/datacontract/passing/head/contracts/**/*.odcs.yaml

  call-datacontract-notice:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/datacontract.yml
    with:
      fixture: test/fixtures/datacontract/modified-breaking
      evidence_artifact: datacontract-evidence-notice

  verify-notice:
    needs: [call-datacontract-notice]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: The consumer notice is on this PR, from this run, naming each consumer
        run: |
          set -euo pipefail
          marker='<!-- straterai-gates:datacontract-consumers -->'
          body=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- straterai-gates:datacontract-consumers -->"))) | .body')
          printf '%s\n' "$body"
          [ "$(printf '%s\n' "$body" | grep -Fc -- "$marker")" = 1 ] || { echo "::error::expected exactly one notice comment"; exit 1; }
          for want in "/actions/runs/$RUN_ID" \
            '#### `contracts/orders.odcs.yaml`' \
            '- [example-org/billing](https://github.com/example-org/billing) · @example-org/billing-team' \
            '- `Finance analysts`' \
            'Why: datacontract breaking reports a breaking change'; do
            printf '%s\n' "$body" | grep -Fq -- "$want" || { echo "::error::the notice does not contain: $want"; exit 1; }
          done

  call-dbt:
    permissions:
      contents: read
      id-token: write # the called workflow declares it; a caller cannot grant less
    uses: ./.github/workflows/dbt.yml
    with:
      lint_all: true
      dbt_project_dir: test/fixtures/dbt/duckdb-project
      adapter_package: dbt-duckdb==1.11.1
      auth: none

  call-governance:
    permissions:
      contents: write
    uses: ./.github/workflows/governance.yml
    with:
      checks: |
        gates:governance/version=version
        gates:governance/monitors=monitors --repo test/fixtures/governance/monitors/elementary/project --manifest test/fixtures/governance/monitors/elementary/project/target/manifest.json
        gates:governance/monitors-gx=monitors --repo test/fixtures/governance/monitors/gx/routed --gx test/fixtures/governance/monitors/gx/routed/gx
      dbt_parse: test/fixtures/governance/monitors/elementary/project
      gx: true

  self-test:
    if: ${{ always() }}
    needs: [unit, monitors-engine, call-squawk, call-datacontract, call-datacontract-notice, verify-notice, call-dbt, call-governance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      MUST_SUCCEED: ${{ needs.unit.result }} ${{ needs.monitors-engine.result }} ${{ needs.call-squawk.result }} ${{ needs.call-datacontract.result }} ${{ needs.call-dbt.result }} ${{ needs.call-governance.result }}
      NOTICE: ${{ needs.call-datacontract-notice.result }}
      VERIFY: ${{ needs.verify-notice.result }}
      SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Every job ended the way it should
        run: |
          echo "must succeed: $MUST_SUCCEED; notice (must fail on a same-repo PR): $NOTICE; verify-notice: $VERIFY; same-repo PR: $SAME_REPO_PR"
          for r in $MUST_SUCCEED; do [ "$r" = success ] || { echo "::error::a self-test job did not succeed"; exit 1; }; done
          if [ "$SAME_REPO_PR" = true ]; then
            [ "$NOTICE" = failure ] || { echo "::error::the breaking fixture must fail the contract gate (got $NOTICE)"; exit 1; }
            [ "$VERIFY" = success ] || { echo "::error::the consumer notice was not found on the PR (got $VERIFY)"; exit 1; }
          elif [ "$NOTICE" != skipped ] || [ "$VERIFY" != skipped ]; then
            echo "::error::the notice jobs should be skipped outside a same-repo PR (got $NOTICE, $VERIFY)"
            exit 1
          fi
