# Reusable gate: lint every data contract, and fail on breaking changes, deletions and retirements.
# Lint and breaking-change checks only: neither touches data. Run `datacontract test` from the pipeline,
# with a read-only credential, not from this job.
#
# Caller stub (make "contracts / contracts" the required check):
#
#   name: datacontract
#   on: pull_request
#   permissions:
#     contents: read
#   jobs:
#     contracts:
#       uses: gbholdings/straterai-gates/.github/workflows/datacontract.yml@<40-char sha> # v1.0.0
#
# No `paths:` filter on purpose (a required check from a path-filtered workflow waits on "Expected" forever).
# The job always runs; its first step works out whether a contract changed, and the rest are skipped
# (the job still passes) when none did.
#
# Every contract must be a regular file. A symlink or submodule at or under the contracts folder, or a
# file-type change there, fails the first step: lint and breaking would read whatever the link points at.
#
# Deleting a contract, renaming it, or setting its `status:` to retired is the most breaking change there
# is, so the job fails for each unless RETIRED.md (in the contracts folder), as it stands on the BASE
# branch, already lists the contract's path as the first word of a line (an optional leading "- " and
# trailing ":" are fine). Git rename detection is off (--no-renames), so a rename is the old path deleted
# and a new path added: the old path needs the RETIRED.md line, and the new file is linted as new.
# The PR cannot approve its own deletion: the retirement goes in first, in a PR that edits only
# RETIRED.md, which CODEOWNERS routes to a reviewer; the deletion follows once that has merged. The PR
# description and the PR's own copy of RETIRED.md are not read, because whoever opens the PR writes both.
name: datacontract
on:
  workflow_call:
    inputs:
      contracts_glob:
        description: "Pathspec glob of contract files. Its folder holds RETIRED.md."
        type: string
        default: "contracts/*.odcs.yaml"
      datacontract_cli:
        description: "datacontract-cli version from PyPI."
        type: string
        default: "1.2.8"
      lint_all:
        description: "Lint every matching tracked contract and skip the base comparison. For self-tests and first adoption."
        type: boolean
        default: false
permissions: {}
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref }}
      CONTRACTS_GLOB: ${{ inputs.contracts_glob }}
      DATACONTRACT_CLI: ${{ inputs.datacontract_cli }}
      LINT_ALL: ${{ inputs.lint_all }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did a contract change?
        id: changes
        run: |
          set -uo pipefail
          G() { git -c core.attributesFile=/dev/null -c core.quotePath=false "$@"; }
          DIR="${CONTRACTS_GLOB%/*}"
          bad=0
          # Symlinks and submodules at or under the contracts folder in the PR's tree, changed or not.
          while IFS= read -r -d '' e; do
            mode=${e%% *}; p=${e#*$'\t'}
            case "$p" in "$DIR"|"$DIR"/*) ;; *) continue ;; esac
            case "$mode" in 120000|160000) echo "::error::$p is a symlink or a submodule (mode $mode). A contract must be a regular file."; bad=1 ;; esac
          done < <(G ls-tree -r -z --full-tree HEAD)
          if [ "$LINT_ALL" = "true" ]; then
            [ "$bad" = 0 ] || exit 1
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="origin/$BASE_REF"
          G rev-parse -q --verify "$BASE^{commit}" >/dev/null || { echo "::error::cannot resolve $BASE"; exit 1; }
          # Any file-type change there.
          while IFS= read -r -d '' meta && IFS= read -r -d '' p; do
            read -r _ newmode _ _ status <<< "$meta"
            case "$p" in "$DIR"|"$DIR"/*) ;; *) continue ;; esac
            if [ "$status" = T ]; then echo "::error::$p changed file type (now mode $newmode). A contract must be a regular file."; bad=1; fi
          done < <(G diff --raw -z --no-renames --no-textconv --no-ext-diff "$BASE...HEAD")
          [ "$bad" = 0 ] || exit 1
          if [ -z "$(G diff --name-only --no-renames --no-textconv --no-ext-diff "$BASE...HEAD" -- ":(glob)$CONTRACTS_GLOB")" ]; then
            echo "no contract changed; the rest of this job is skipped"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        if: steps.changes.outputs.changed == 'true'
        run: pip install "datacontract-cli==$DATACONTRACT_CLI"
      - name: Lint every contract
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -uo pipefail
          fail=0
          found=0
          while IFS= read -r -d '' f; do
            found=1
            datacontract lint "$f" || fail=1
          done < <(git ls-files -z -- ":(glob)$CONTRACTS_GLOB")
          [ "$found" = 1 ] || echo "no contract files match $CONTRACTS_GLOB"
          exit $fail
      - name: Breaking changes, deletions and retirements
        if: steps.changes.outputs.changed == 'true' && inputs.lint_all != true
        run: |
          set -uo pipefail
          G() { git -c core.attributesFile=/dev/null -c core.quotePath=false "$@"; }
          BASE="origin/$BASE_REF"
          DIR="${CONTRACTS_GLOB%/*}"
          T=$(mktemp -d "${RUNNER_TEMP:-/tmp}/contracts.XXXXXX")
          fail=0
          # Read from the base branch, never the working tree: the PR's own RETIRED.md is its author's word.
          retired() {
            G cat-file blob "$BASE:$DIR/RETIRED.md" 2>/dev/null \
              | awk -v p="$1" '{ sub(/^[-*][[:space:]]+/, "") } $1 == p || $1 == p ":" { f = 1 } END { exit !f }'
          }
          # The top-level `status:` of a contract on stdin, parsed as YAML, lowercased.
          status_of() {
            python3 -c 'import sys, yaml; d = yaml.safe_load(sys.stdin); s = d.get("status") if isinstance(d, dict) else None; print("" if s is None else str(s).strip().lower())'
          }
          while IFS= read -r -d '' st && IFS= read -r -d '' p; do
            case "$st" in
              M)
                G cat-file blob "$BASE:$p" > "$T/old.odcs.yaml"
                datacontract breaking "$T/old.odcs.yaml" "$p" </dev/null || fail=1
                if ! old=$(status_of < "$T/old.odcs.yaml") || ! new=$(G cat-file blob "HEAD:$p" | status_of); then
                  echo "::error::$p: could not read its status as YAML."
                  fail=1
                elif [ "$new" = retired ] && [ "$old" != retired ] && ! retired "$p"; then
                  echo "::error::$p sets status: retired. Retire it first: a separate PR that adds its path to $DIR/RETIRED.md, reviewed and merged to the base branch, then rebase this one."
                  fail=1
                fi ;;
              D)
                if ! retired "$p"; then
                  echo "::error::$p was deleted or renamed. Retire it first: a separate PR that adds its path to $DIR/RETIRED.md, reviewed and merged to the base branch, then rebase this one."
                  fail=1
                fi ;;
              A) ;;
              *)
                echo "::error::$p: unexpected change $st."
                fail=1 ;;
            esac
          done < <(G diff --name-status -z --no-renames --no-textconv --no-ext-diff "$BASE...HEAD" -- ":(glob)$CONTRACTS_GLOB")
          exit $fail
