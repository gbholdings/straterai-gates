# Reusable gate: compile the dbt models a PR changes, dry-run each one on BigQuery, and fail when a
# model would process more bytes than its budget in warehouse-budgets.yml. A dry run is free and runs
# nothing. The script is scripts/bq-dry-run-check.mjs (budget file format in its header).
#
# Caller stub (make "bq-dry-run / bq-dry-run" the required check). A reusable workflow cannot exceed
# the caller's permissions, so the stub declares id-token: write:
#
#   name: bq-dry-run
#   on: pull_request
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     bq-dry-run:
#       uses: gbholdings/straterai-gates/.github/workflows/bq-dry-run.yml@<40-char sha> # v1.1.0
#       with:
#         project_id: ${{ vars.BQ_DRY_RUN_PROJECT }}
#         workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
#         service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
#
# Setup, once per repo:
#   1. warehouse-budgets.yml at the repo root (or set budgets_path): a `default` and per-model bytes.
#   2. <dbt project>/ci/profiles.yml with a `ci` target dbt can compile against (method: oauth uses the
#      credentials the auth step writes).
#   3. A service account that can create jobs in project_id (roles/bigquery.jobUser) and read table
#      metadata for the models' sources (roles/bigquery.metadataViewer); a dry run needs no data read.
#      Trust only this repo on the workload identity provider. A PR from a fork gets no token and fails
#      at the auth step.
#
# No `paths:` filter on purpose: the job always runs and passes when no model changed.
name: bq-dry-run
on:
  workflow_call:
    inputs:
      project_id:
        description: "Project the dry-run jobs are created in."
        type: string
        required: true
      location:
        description: "BigQuery location of the models' datasets."
        type: string
        default: "US"
      dbt_project_dir:
        description: "The folder holding dbt_project.yml."
        type: string
        default: "."
      budgets_path:
        description: "Budget file, relative to the repo root."
        type: string
        default: "warehouse-budgets.yml"
      adapter_package:
        type: string
        default: "dbt-bigquery==1.12.1"
      dbt_core:
        type: string
        default: "1.12.6"
      workload_identity_provider:
        type: string
        default: ""
      service_account:
        type: string
        default: ""
      gates_sha:
        description: "Commit of straterai-gates to run the script from. Default: the called workflow's own commit (job.workflow_sha)."
        type: string
        default: ""
      lint_all:
        description: "Check every model, not only the ones the PR changes."
        type: boolean
        default: false
permissions: {}
jobs:
  bq-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud
    env:
      GATES_DBT_DIR: ${{ inputs.dbt_project_dir }}
      BUDGETS_PATH: ${{ inputs.budgets_path }}
      PROJECT_ID: ${{ inputs.project_id }}
      BQ_LOCATION: ${{ inputs.location }}
      BASE_REF: ${{ github.base_ref }}
      LINT_ALL: ${{ inputs.lint_all }}
      DBT_CORE: ${{ inputs.dbt_core }}
      ADAPTER_PACKAGE: ${{ inputs.adapter_package }}
      DO_NOT_TRACK: "1" # dbt usage statistics off
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Which models changed?
        id: changes
        run: |
          d="${GATES_DBT_DIR%/}"
          if [ "$d" = "." ] || [ -z "$d" ]; then p=""; else p="$d/"; fi
          if [ "$LINT_ALL" = "true" ]; then
            files=$(git ls-files -- ":(glob)${p}models/**/*.sql")
          else
            files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- ":(glob)${p}models/**/*.sql")
          fi
          if [ -z "$files" ]; then
            echo "no model changed; the rest of this job is skipped"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$BUDGETS_PATH" ]; then
            echo "::error::models changed but $BUDGETS_PATH does not exist"
            exit 1
          fi
          models=$(printf '%s\n' "$files" | sed 's#.*/##; s#\.sql$##' | sort -u | tr '\n' ' ')
          echo "models: $models"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "models=$models" >> "$GITHUB_OUTPUT"
      - name: Check out the gates
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.gates_sha || job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        if: steps.changes.outputs.changed == 'true'
        run: pip install "dbt-core==$DBT_CORE" "$ADAPTER_PACKAGE"
      - name: Authenticate to Google Cloud (keyless)
        id: auth
        if: steps.changes.outputs.changed == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
          token_format: access_token
      - name: Compile the changed models
        if: steps.changes.outputs.changed == 'true'
        working-directory: ${{ inputs.dbt_project_dir }}
        env:
          DBT_PROFILES_DIR: ./ci
          MODELS: ${{ steps.changes.outputs.models }}
        run: |
          dbt deps
          # shellcheck disable=SC2086 # one selector per model name
          dbt compile --target ci --select $MODELS
      - name: Dry-run each model against its budget
        if: steps.changes.outputs.changed == 'true'
        env:
          MODELS: ${{ steps.changes.outputs.models }}
          BQ_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          d="${GATES_DBT_DIR%/}"
          node .gates/scripts/bq-dry-run-check.mjs --budgets "$BUDGETS_PATH" --compiled-dir "${d:-.}/target/compiled" --models "$MODELS" --project "$PROJECT_ID" --location "$BQ_LOCATION"
