# Reusable gate: run governance checks with scripts/governance-check.mjs and record each result as an
# evidence entry (governance/evidence.json, format in the README).
#
# Caller stub. The stub declares contents: write because a reusable workflow cannot exceed it; only the
# `publish` job uses it, on push, dispatch and schedule on the default branch, and only for the evidence branch:
#
#   name: governance
#   on:
#     push:
#       branches: [main]
#     pull_request:
#     schedule:
#       - cron: "17 5 * * 1"
#   permissions:
#     contents: write
#   jobs:
#     governance:
#       uses: gbholdings/straterai-gates/.github/workflows/governance.yml@<40-char sha> # v1.6.0
#       with:
#         checks: |
#           governance:data-contract/owner=owner --contracts contracts --manifest target/manifest.json
#           governance:data-privacy/classification=classification prisma --schema prisma/schema.prisma --base origin/main
#           governance:data-privacy/classification-dbt=classification dbt --manifest transform/target/manifest.json --repo transform --catalog transform/target/catalog.json
#           governance:data-privacy/deletion-map=deletion-map --prisma prisma/schema.prisma --manifest transform/target/manifest.json --repo transform
#           governance:data-privacy/retention=retention
#           governance:data-privacy/exports=exports --module src/export/**/*.ts --prisma prisma/schema.prisma
#
# `--schema prisma/schema.prisma` reads the whole multi-file schema: every *.prisma in its folder that has no
# datasource of its own.
#
# Each line of `checks` is `<plugin>:<skill>/<gate>=<subcommand and arguments>`, split on spaces (no
# quoting) and run as `node governance-check.mjs <arguments>` in the caller's checkout
# (scripts/run-governance-checks.sh), which is a full clone (fetch-depth: 0), so `--base origin/<branch>`
# resolves. Each check reports its own status, which is what is recorded: pass when it looked at everything
# and found nothing, fail when it found a problem, not_run when it could not look at some input (a NOT CHECKED
# line, a missing input, a base that does not resolve), whatever its exit code. Anything but pass fails the
# job. Nothing missing is ever recorded as a pass.
#
# A check that reads a dbt manifest needs one parsed from this commit; a committed manifest is stale by
# construction and the monitors check refuses it. `dbt_parse` names the dbt project folders to parse here,
# one per line: dbt-duckdb from the gates' hash-pinned lock, a throwaway duckdb profile under the project's
# profile name (parse opens no connection), `dbt deps`, then `dbt parse`, which writes
# <folder>/target/manifest.json. A project whose parse needs its own adapter fails to parse; its check then
# finds no manifest and records not_run. `gx: true` installs GX Core from the gates' lock and points
# GATES_GX_PYTHON at it, so the monitors check can load each GX context in GX itself:
#
#       with:
#         dbt_parse: transform
#         checks: |
#           governance:data-quality/monitors=monitors --repo . --manifest transform/target/manifest.json
#
# Isolation. The `governance` job reads the caller's tree (on a pull request, the PR's) and holds only
# `contents: read`, no secret and no token in its environment. Every run step starts bash with BASH_ENV
# and ENV unset, and the script runs any Python with -I from outside the checkout. Its entries go to the
# `publish` job as an artifact. `publish` runs only on push, dispatch and schedule on the default branch (its own code),
# never checks out a pull request, holds `contents: write`, and appends the entries to the
# `governance-evidence` branch (only that file; protect it with a ruleset that allows the Actions bot). On
# a pull request nothing is written to a branch: the entries are uploaded as the artifact
# `governance-evidence` and the job stops there.
name: governance
on:
  workflow_call:
    inputs:
      checks:
        description: "One check per line: <plugin>:<skill>/<gate>=<governance-check.mjs arguments>."
        type: string
        default: ""
      evidence_branch:
        type: string
        default: "governance-evidence"
      evidence_artifact:
        description: "Name of the entries artifact. Change it when one run calls this workflow twice."
        type: string
        default: "governance-evidence"
      gates_sha:
        description: "Commit of straterai-gates to run the script from. Default: the called workflow's own commit (job.workflow_sha)."
        type: string
        default: ""
      dbt_parse:
        description: "dbt project folders to `dbt parse` before the checks, one per line. Empty: no dbt."
        type: string
        default: ""
      gx:
        description: "Install GX Core and set GATES_GX_PYTHON, so the monitors check loads GX contexts in GX."
        type: boolean
        default: false
permissions: {}
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: env -u BASH_ENV -u ENV bash --noprofile --norc -eo pipefail {0}
    outputs:
      recorded: ${{ steps.run.outputs.recorded }}
    env:
      CHECKS: ${{ inputs.checks }}
      GATES_SHA: ${{ inputs.gates_sha }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DBT_PARSE: ${{ inputs.dbt_parse }}
      DO_NOT_TRACK: "1"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      GX_ANALYTICS_ENABLED: "false"
    steps:
      - name: Check the inputs
        run: |
          if [ -n "$GATES_SHA" ] && ! [[ "$GATES_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gates_sha must be a full 40-character commit SHA, not a branch or tag"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.gates_sha || job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - if: ${{ inputs.dbt_parse != '' || inputs.gx }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: dbt-duckdb and GX Core from the gates' hash-pinned locks
        if: ${{ inputs.dbt_parse != '' || inputs.gx }}
        working-directory: ${{ runner.temp }}
        env:
          WANT_GX: ${{ inputs.gx }}
          REQS: ${{ github.workspace }}/.gates/requirements
        run: |
          set -euo pipefail
          if [ -n "${DBT_PARSE//[[:space:]]/}" ]; then
            python3 -I -m venv gates-dbt
            env -u BASH_ENV -u ENV gates-dbt/bin/python -I -m pip install --disable-pip-version-check --quiet --require-hashes -r "$REQS/dbt-duckdb-1.11.1.txt"
          fi
          if [ "$WANT_GX" = true ]; then
            python3 -I -m venv gates-gx
            env -u BASH_ENV -u ENV gates-gx/bin/python -I -m pip install --disable-pip-version-check --quiet --require-hashes -r "$REQS/great-expectations-1.24.1.txt"
            echo "GATES_GX_PYTHON=$RUNNER_TEMP/gates-gx/bin/python" >> "$GITHUB_ENV"
          fi
      - name: dbt parse each dbt_parse folder
        if: ${{ inputs.dbt_parse != '' }}
        env:
          DBT: ${{ runner.temp }}/gates-dbt/bin/dbt
        run: env -u BASH_ENV -u ENV bash .gates/scripts/dbt-parse.sh
      - name: Run checks and record evidence
        id: run
        if: ${{ !cancelled() }} # after a failed parse too: the check that wanted its manifest records not_run
        env:
          GOVERNANCE_EVIDENCE_FILE: ${{ runner.temp }}/governance-entries/evidence.json
        run: env -u BASH_ENV -u ENV bash .gates/scripts/run-governance-checks.sh
      - name: Upload the entries
        if: ${{ !cancelled() && steps.run.outputs.recorded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.evidence_artifact }}
          path: ${{ runner.temp }}/governance-entries/evidence.json

  publish:
    needs: [governance]
    # Push to the default branch, a dispatch on the default branch, or a schedule (which runs there). Never a
    # pull request, and never another branch: a feature branch's results are not the repository's evidence.
    if: >-
      ${{ !cancelled() && needs.governance.outputs.recorded == 'true'
      && (github.event_name == 'schedule'
      || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the evidence branch; this job never runs on a pull request
    concurrency:
      group: governance-evidence-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        shell: env -u BASH_ENV -u ENV bash --noprofile --norc -eo pipefail {0}
    env:
      EVIDENCE_BRANCH: ${{ inputs.evidence_branch }}
    steps:
      - name: Check out the default branch (never a pull request)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.gates_sha || job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - name: Download this run's entries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.evidence_artifact }}
          path: ${{ runner.temp }}/governance-entries
      - name: Merge them into the evidence branch's file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/evidence.json"
          rm -f "$out"
          auth="http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # Exit 2 is "no such branch" (the first run starts an empty file); any other failure stops here,
          # so a fetch that could not authenticate never publishes a file without the earlier entries.
          rc=0
          git -c "$auth" ls-remote --exit-code --heads origin "$EVIDENCE_BRANCH" >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git -c "$auth" fetch --quiet origin "$EVIDENCE_BRANCH"
            if git cat-file -e "FETCH_HEAD:governance/evidence.json" 2>/dev/null; then git show "FETCH_HEAD:governance/evidence.json" > "$out"; fi
          elif [ "$rc" != 2 ]; then
            echo "::error::could not read the $EVIDENCE_BRANCH branch (git ls-remote exit $rc); nothing published"
            exit 1
          fi
          node .gates/scripts/governance-check.mjs evidence append --from "$RUNNER_TEMP/governance-entries/evidence.json" --file "$out"
      - name: Publish evidence to the evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: EVIDENCE_FILE="$RUNNER_TEMP/evidence.json" bash .gates/scripts/publish-evidence.sh
