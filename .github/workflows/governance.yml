# Reusable gate: run governance checks with scripts/governance-check.mjs and record each result as an
# evidence entry (governance/evidence.json, format in the README).
#
# Caller stub. The stub declares contents: write because a reusable workflow cannot exceed it; only the
# `publish` job uses it, only on push to the default branch, schedule or a manual run, and only for the
# evidence branch:
#
#   name: governance
#   on:
#     push:
#       branches: [main]
#     pull_request:
#     schedule:
#       - cron: "17 5 * * 1"
#   permissions:
#     contents: write
#   jobs:
#     governance:
#       uses: gbholdings/straterai-gates/.github/workflows/governance.yml@<40-char sha> # v1.3.0
#       with:
#         checks: |
#           governance:data-contract/owner=owner --contracts contracts --manifest target/manifest.json
#           governance:data-access/credentials=credentials --config .env.example --config config/**/*.env --targets .claude/db-targets.json
#
# Each line of `checks` is `<plugin>:<skill>/<gate>=<subcommand and arguments>`, split on spaces (no
# quoting, no shell globbing: a glob goes to the script as written, which expands it over committed
# files) and run as `node governance-check.mjs <arguments>` in the caller's checkout. Exit 0 records
# pass; any other exit records fail and fails the job. A `checks` input with no check in it fails the
# job: a gate that ran nothing is NOT CHECKED, never a pass.
#
# Isolation. The `governance` job reads the caller's tree with `contents: read` and no token in any
# step. It writes this run's entries to a file and uploads it as an artifact. The `publish` job alone
# holds `contents: write`; it never runs on a pull request (it runs only on push to the default branch,
# schedule and workflow_dispatch), merges the artifact into the evidence branch's file with
# `evidence merge` (which refuses anything but evidence entries) and pushes only that file. Every run
# step starts bash with BASH_ENV and ENV unset.
#
# On a pull request nothing is written to a branch: the run's would-be entries are the artifact.
name: governance
on:
  workflow_call:
    inputs:
      checks:
        description: "One check per line: <plugin>:<skill>/<gate>=<governance-check.mjs arguments>."
        type: string
        default: ""
      evidence_branch:
        type: string
        default: "governance-evidence"
      evidence_artifact:
        description: "Name of the uploaded artifact with this run's entries. Set it when one workflow calls this gate twice."
        type: string
        default: "governance-evidence"
      gates_sha:
        description: "Commit of straterai-gates to run the script from. Default: the called workflow's own commit (job.workflow_sha)."
        type: string
        default: ""
permissions: {}
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: env -u BASH_ENV -u ENV bash --noprofile --norc -eo pipefail {0}
    outputs:
      recorded: ${{ steps.run.outputs.recorded }}
    env:
      CHECKS: ${{ inputs.checks }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the gates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.gates_sha || job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - name: Run checks and record evidence
        id: run
        run: |
          set -uo pipefail
          GC=".gates/scripts/governance-check.mjs"
          [ -f "$GC" ] || { echo "::error::$GC is missing from the gates checkout"; exit 1; }
          export GOVERNANCE_EVIDENCE_FILE="$RUNNER_TEMP/run-evidence.json"
          rm -f "$GOVERNANCE_EVIDENCE_FILE"
          failed=0
          ran=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [ -z "${line// /}" ] && continue
            case "$line" in \#*) continue ;; esac
            case "$line" in *=*) ;; *) echo "::error::bad checks line (want name=args): $line"; failed=1; continue ;; esac
            name="${line%%=*}"
            read -r -a args <<< "${line#*=}"
            ran=1
            if node "$GC" "${args[@]}"; then result=pass; detail="exit 0"; else rc=$?; result=fail; detail="exit $rc"; failed=1; fi
            node "$GC" evidence append --check "$name" --result "$result" --run-link "$RUN_LINK" --commit "$COMMIT" --detail "$detail" || exit $?
            echo "recorded=true" >> "$GITHUB_OUTPUT"
          done <<< "$CHECKS"
          if [ "$ran" != 1 ]; then echo "::error::no checks configured: NOT CHECKED. Set the checks input."; exit 1; fi
          exit $failed
      - name: Upload this run's entries
        if: ${{ !cancelled() && steps.run.outputs.recorded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.evidence_artifact }}
          path: ${{ runner.temp }}/run-evidence.json
          if-no-files-found: error

  publish:
    needs: [governance]
    if: >-
      ${{ !cancelled() && needs.governance.outputs.recorded == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the evidence branch; this job never runs on a pull request
    concurrency:
      group: governance-evidence-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        shell: env -u BASH_ENV -u ENV bash --noprofile --norc -eo pipefail {0}
    env:
      EVIDENCE_BRANCH: ${{ inputs.evidence_branch }}
    steps:
      - name: Check out the default branch (never a pull request)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the gates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.gates_sha || job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - name: Download this run's entries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.evidence_artifact }}
          path: ${{ runner.temp }}/run
      - name: Merge them into the evidence branch's file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/evidence.json"
          rm -f "$out"
          auth="http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # Exit 2 is "no such branch" (the first run starts an empty file); any other failure stops here,
          # so a fetch that could not authenticate never publishes a file without the earlier entries.
          rc=0
          git -c "$auth" ls-remote --exit-code --heads origin "$EVIDENCE_BRANCH" >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git -c "$auth" fetch --quiet origin "$EVIDENCE_BRANCH"
            if git cat-file -e "FETCH_HEAD:governance/evidence.json" 2>/dev/null; then git show "FETCH_HEAD:governance/evidence.json" > "$out"; fi
          elif [ "$rc" != 2 ]; then
            echo "::error::could not read the $EVIDENCE_BRANCH branch (git ls-remote exit $rc); nothing published"
            exit 1
          fi
          node .gates/scripts/governance-check.mjs evidence merge --from "$RUNNER_TEMP/run/run-evidence.json" --file "$out"
      - name: Publish evidence to the evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: EVIDENCE_FILE="$RUNNER_TEMP/evidence.json" bash .gates/scripts/publish-evidence.sh
