version: 2
models:
  - name: orders
    config:
      meta:
        owner: "@data-platform"
        channel: data-alerts
    data_tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: updated_at
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: updated_at
      # the test's own channel wins over the model's, under alerts_config as Elementary reads it
      - elementary.schema_changes:
          config:
            meta:
              alerts_config:
                channel: schema-alerts
  # suppressed for 100000 hours, about eleven years, after the first alert
  - name: customers
    config:
      meta:
        owner: "@data-platform"
        channel: data-alerts
    data_tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: updated_at
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: updated_at
          config:
            meta:
              alert_suppression_interval: 100000
